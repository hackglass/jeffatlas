name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs, so production
# deployments are allowed to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: src/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('src/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('src/package-lock.json') }}-

      - name: Drop server routes (GitHub Pages is static; the whiteboard brain needs a server)
        run: rm -rf app/api

      # Public build values (NEXT_PUBLIC_ELEVENLABS_AGENT_ID, NEXT_PUBLIC_POSTHOG_KEY,
      # NEXT_PUBLIC_POSTHOG_HOST) come from Infisical's /web folder, exported as env
      # for the steps below. Only /web: server keys never reach the static build.
      # Repo Variables INFISICAL_IDENTITY_ID and INFISICAL_PROJECT_SLUG point at it.
      # Off until the Infisical project slug and identity are sorted; the build
      # reads the same three values from repo Variables below meanwhile.
      # - name: Fetch build values from Infisical
      #   uses: Infisical/secrets-action@v1.0.18
      #   with:
      #     method: oidc
      #     identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
      #     project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
      #     env-slug: prod
      #     secret-path: /web
      #     domain: https://app.infisical.com

      - name: Build with Next.js
        run: npm run build
        env:
          # Static site: no /api routes on GitHub Pages (the whiteboard brain needs a server).
          STATIC_EXPORT: "1"
          # For project sites this is "/<repo>"; empty for user/org sites.
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          # Interim, while the Infisical step is off: public values from repo Variables.
          # Remove these three when it is back on.
          NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${{ vars.NEXT_PUBLIC_ELEVENLABS_AGENT_ID }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./src/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
