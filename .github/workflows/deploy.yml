name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs, so production
# deployments are allowed to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: src/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('src/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('src/package-lock.json') }}-

      - name: Drop server routes (GitHub Pages is static; the whiteboard brain needs a server)
        run: rm -rf app/api

      - name: Build with Next.js
        run: npm run build
        env:
          # Static site: no /api routes on GitHub Pages (the whiteboard brain needs a server).
          STATIC_EXPORT: "1"
          # For project sites this is "/<repo>"; empty for user/org sites.
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          # Public ElevenLabs agent id (repo Settings -> Secrets and variables -> Actions -> Variables).
          NEXT_PUBLIC_ELEVENLABS_AGENT_ID: ${{ vars.NEXT_PUBLIC_ELEVENLABS_AGENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
